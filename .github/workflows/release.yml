name: Release

# Fully automatic: when CI goes green on main for a commit that changes the app, this builds it and publishes a GitHub
# Release (installer + portable zip + checksums). Versions are <series>.<build number>, e.g. 1.4.57, where the series
# (1.4) is APP_VERSION in bose_app.py. Add [skip release] to a commit message to opt out.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if only docs/tests changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      prev: ${{ steps.plan.outputs.prev }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Work out the version and whether the app changed
        id: plan
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $m = (Select-String -Path bose_app.py -Pattern '^APP_VERSION = "(\d+)\.(\d+)\.\d+"').Matches[0]
          $ver = "{0}.{1}.{2}" -f $m.Groups[1].Value, $m.Groups[2].Value, $env:GITHUB_RUN_NUMBER
          $prev = (git describe --tags --abbrev=0 --match 'v*' 2>$null)
          if ($LASTEXITCODE -ne 0) { $prev = '' }
          $publish = $true
          $why = 'first release'
          if ($prev) {
            $changed = @(git diff --name-only "$prev..HEAD")
            # only these files change what users run; docs, tests and repo plumbing do not warrant a release
            $worthy = @($changed | Where-Object { $_ -match '^(bose_app\.py|updater\.py|requirements\.txt|make_icon\.py|assets/|installer/|scripts/(build_exe|make_version_file)\.py)' })
            $publish = $worthy.Count -gt 0
            $why = if ($publish) { "$($worthy.Count) app file(s) changed since $prev" } else { "only docs/tests/plumbing changed since $prev" }
          }
          if ('${{ inputs.force }}' -eq 'true') { $publish = $true; $why = 'forced' }
          if (git tag -l "v$ver") { $publish = $false; $why = "tag v$ver already exists" }
          Write-Host "version=$ver publish=$publish ($why)"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "prev=$prev" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

  release:
    name: Build and publish v${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write        # create the tag and the GitHub Release
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Stamp the version and repository into the app
        shell: pwsh
        run: |
          Set-Content build_info.py -Encoding utf8 -Value @(
            '"""Generated by the release workflow."""',
            'REPO = "${{ github.repository }}"',
            'VERSION = "${{ needs.plan.outputs.version }}"'
          )
          Get-Content build_info.py

      - name: Build the exe
        run: python scripts/build_exe.py

      - name: Smoke-test the exe
        run: python scripts/smoke_test_exe.py dist/BoseSoundbarRemote/BoseSoundbarRemote.exe

      - name: Build installer, portable zip and checksums
        shell: pwsh
        run: |
          $ver = "${{ needs.plan.outputs.version }}"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\BoseSoundbarRemote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist-installer\BoseSoundbarRemote-Setup-$ver.exe" release\
          Compress-Archive -Path dist\BoseSoundbarRemote -DestinationPath "release\BoseSoundbarRemote-$ver-portable.zip"
          Push-Location release
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-Content release\SHA256SUMS.txt

      - name: Test the installer end to end (install, run, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release -Filter 'BoseSoundbarRemote-Setup-*.exe').FullName
          $dir = Join-Path $env:RUNNER_TEMP 'bose-installed'
          # Wait for the installer process only: -Wait would also wait for the app it relaunches, forever.
          $p = Start-Process $setup -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$dir"
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          Get-Process BoseSoundbarRemote -ErrorAction SilentlyContinue | Stop-Process -Force
          python scripts/smoke_test_exe.py (Join-Path $dir 'BoseSoundbarRemote.exe')
          $u = Start-Process (Join-Path $dir 'unins000.exe') -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $u.WaitForExit()
          # Inno's uninstaller hands off to a temporary copy of itself and returns at once, so wait for the files to go.
          $deadline = (Get-Date).AddSeconds(90)
          $exe = Join-Path $dir 'BoseSoundbarRemote.exe'
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left the exe behind" }

      - name: Write the release notes
        shell: pwsh
        run: |
          $prev = "${{ needs.plan.outputs.prev }}"
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $changes = (git log $range --no-merges --format='- %s' | Where-Object { $_ -notmatch '\[skip release\]' }) -join "`n"
          if (-not $changes) { $changes = '- Internal changes' }
          $notes = @'
          ## Install

          1. Download **BoseSoundbarRemote-Setup-__VERSION__.exe** below and run it. No Python, no admin rights needed.
          2. If Windows says *"Windows protected your PC"*, click **More info → Run anyway**. The app isn't code-signed yet, so Windows shows this for every new unsigned program.
          3. Sign in with your Bose account (email + password); it finds your speaker by itself.

          Already installed? The app offers this update on its own.

          Prefer no installer? Use the **portable zip**: unzip anywhere and run `BoseSoundbarRemote.exe`.

          Integrity: `SHA256SUMS.txt` lists the checksums, and every file carries a signed build attestation
          (`gh attestation verify <file> --repo __REPO__`).

          Built on [pybose](https://github.com/cavefire/pybose) by cavefire.

          ## What's changed

          __CHANGES__
          '@
          $notes = $notes.Replace('__VERSION__', '${{ needs.plan.outputs.version }}').Replace('__REPO__', '${{ github.repository }}').Replace('__CHANGES__', $changes)
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Attest build provenance (lets anyone verify these files came from this repo's workflow)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/*
          retention-days: 30

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: v${{ needs.plan.outputs.version }}
          body_path: release-notes.md
          files: release/*
          make_latest: true
