[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
timeout = 120            # a hung test fails with a dump of every thread instead of blocking CI for hours
timeout_method = "thread"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["bose_app", "updater"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "dist-installer"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # long lines: the UI code builds wide widget calls
    "E701", "E702", "E731",
    "B008", "B904", "B905", "UP015",
    "UP012", "UP006", "UP031",
    "E743",   # the icon-font helper is deliberately called I()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E741", "F841"]
